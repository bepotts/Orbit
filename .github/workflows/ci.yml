name: App CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Formatting and lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Ensure style tools are installed
        run: |
          command -v swiftformat >/dev/null || brew install swiftformat
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftformat --version
          swiftlint version
      - name: Check formatting
        run: make format-check
      - name: Lint (warnings fail CI)
        run: make lint

  test:
    name: Test (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare CI configuration
        run: cp Config/development.example.xcconfig Config/development.xcconfig
      - name: Select test destination
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == "macOS" ]]; then
            echo 'TEST_DESTINATION=platform=macOS' >> "$GITHUB_ENV"
          else
            device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime, items in devices.items() if "iOS-26-" in runtime for d in items if d["name"].startswith("iPhone")]
          if not iphones:
              sys.exit("No available iOS 26 iPhone simulator")
          print(iphones[0]["udid"])
          ')
            echo "TEST_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
          fi
      - name: Ensure SwiftLint is installed
        run: command -v swiftlint >/dev/null || brew install swiftlint
      - name: Build and run Xcode static analysis
        run: |
          set -o pipefail
          mkdir -p TestReports
          xcodebuild clean build analyze \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -configuration Debug \
            -destination "$TEST_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            | tee TestReports/analysis-build.log
      - name: Run SwiftLint analyzer (warnings fail CI)
        # SourceKit unused_import analysis resolves platform conditionals on the host.
        if: matrix.platform == 'macOS'
        run: |
          swiftlint analyze --strict --config .swiftlint.yml \
            --compiler-log-path TestReports/analysis-build.log
      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p TestReports
          xcodebuild test \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -configuration Debug \
            -destination "$TEST_DESTINATION" \
            -resultBundlePath TestReports/Orbit.xcresult \
            -only-testing:OrbitTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee TestReports/xcodebuild.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.platform }}
          path: TestReports/
          retention-days: 14
          if-no-files-found: ignore
